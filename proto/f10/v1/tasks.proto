syntax = "proto3";

package f10.v1;

import "f10/v1/caller.proto";
import "google/protobuf/timestamp.proto";

// TaskService creates and reads tracker tasks through the project's tracker.
service TaskService {
  // CreateTask creates a task in a project's tracker and returns its id.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // GetTask reads a task from a project's tracker, comments included.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
}

// A TaskRef names a task: its id, its title as the tracker holds it, and
// where it opens.
message TaskRef {
  string id = 1;
  string title = 2;
  string url = 3;
}

// A Task is one tracker task as f10 reads it.
message Task {
  TaskRef ref = 1;
  // state is the tracker's own word, such as OPEN or CLOSED.
  string state = 2;
  google.protobuf.Timestamp created = 3;
  // markdown is the task's text, comments included, as f10 renders it.
  string markdown = 4;
  // after is the task this one builds on, empty for none.
  string after = 5;
  repeated string labels = 6;
}

message CreateTaskRequest {
  // project is a project id, such as github.com/acme/widgets, or the path of
  // its main checkout.
  string project = 1;
  string title = 2;
  // body is the task's text in markdown.
  string body = 3;
  string status = 4;
  string priority = 5;
  repeated string labels = 6;
  // parent is the id of the task this one is a subtask of.
  string parent = 7;
  // properties sets the tracker's named properties.
  map<string, string> properties = 8;
  // markdown is the whole task, `# <title>` on its first line, as f10 task
  // create reads it. When set it wins over title and body.
  string markdown = 9;
  CallerContext caller = 10;
  // check refuses as a create would before it reads the task, where
  // nothing here creates tasks, and creates nothing, so f10 task create
  // leaves stdin unread for the caller to fall back on.
  bool check = 11;
}

message CreateTaskResponse {
  TaskRef task = 1;
  // printed is the id f10 task create prints, and its warnings.
  Printed printed = 2;
}

message GetTaskRequest {
  string project = 1;
  string id = 2;
  // skip_images leaves the images the task links unread.
  bool skip_images = 3;
  // caller is where a local f10 task read runs: an empty id is its
  // checkout's task, and a bundle's ids joined by + read every member.
  CallerContext caller = 4;
}

message GetTaskResponse {
  Task task = 1;
  // document is the task as f10 task read prints it: a bundle's members
  // joined, and the images saved locally unless skip_images is set or
  // the caller's output is a terminal.
  string document = 2;
}
