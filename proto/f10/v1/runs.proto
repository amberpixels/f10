syntax = "proto3";

package f10.v1;

import "f10/v1/caller.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// RunService starts, resumes and finishes tasks, and reports where each run is.
service RunService {
  // GetRunStatus is where f10 runs stand: one task's, a project's, or every
  // live run on the machine, with the question a stopped run waits on.
  rpc GetRunStatus(GetRunStatusRequest) returns (GetRunStatusResponse);
  // Start runs a task through its flow in a batch, as f10 start does. A
  // discussion or a picked-up PR opens the worktree, workspace and agent,
  // prompted once, since nothing steers an agent that waits for a person.
  rpc Start(StartRequest) returns (StartResponse);
  // Drive is the old name of StartBatch, kept for clients built against it.
  rpc Drive(DriveRequest) returns (DriveResponse) {
    option deprecated = true;
  }
  // StartBatch runs a list of tasks through a flow as one batch, each once
  // its base has a commit, as f10 start does with a typed command line.
  rpc StartBatch(StartBatchRequest) returns (StartBatchResponse);
  // Resume goes on with a stopped batch wherever each task stopped, the
  // finish included, as f10 resume does. Any task of the batch names it.
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  // Finish merges a task's PR and removes its worktree, branch and workspace.
  rpc Finish(FinishRequest) returns (FinishResponse);
  // Forward hands text to the agent working on a task, as f10 forward does.
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // ListDrives is the old name of ListBatches, kept for clients built
  // against it.
  rpc ListDrives(ListDrivesRequest) returns (ListDrivesResponse) {
    option deprecated = true;
  }
  // CancelDrive is the old name of StopBatch, kept for clients built
  // against it.
  rpc CancelDrive(CancelDriveRequest) returns (CancelDriveResponse) {
    option deprecated = true;
  }
  // ListBatches lists a project's batches, each the tasks one f10 start
  // started, as f10 status --batches does.
  rpc ListBatches(ListBatchesRequest) returns (ListBatchesResponse);
  // StopBatch stops a batch from prompting further and closes its asks, as
  // f10 stop does. Any task of the batch names it.
  rpc StopBatch(StopBatchRequest) returns (StopBatchResponse);
}

// PhaseStatus is where one phase of a run stands.
enum PhaseStatus {
  PHASE_STATUS_UNSPECIFIED = 0;
  PHASE_STATUS_RUNNING = 1;
  PHASE_STATUS_DONE = 2;
  PHASE_STATUS_FAILED = 3;
  // stopped after producing something durable
  PHASE_STATUS_PARTIAL = 4;
  // the work exists from an earlier run
  PHASE_STATUS_PRIOR = 5;
  // a decision ended the run, such as a judge verdict or an ask
  PHASE_STATUS_BLOCKED = 6;
  PHASE_STATUS_SKIPPED = 7;
  // not reached yet: where every phase starts
  PHASE_STATUS_UPCOMING = 8;
}

// A Run is one session's run: its three phases and the ship pipeline.
message Run {
  string session = 1;
  string task = 2;
  string url = 3;
  // root is the checkout the run is about.
  string root = 4;
  string skill = 5;
  PhaseStatus capture = 6;
  PhaseStatus plan = 7;
  PhaseStatus ship = 8;
  // leaf is the pipeline step running, or stopped on.
  string leaf = 9;
  // at is leaf's place in pipeline, counted from 1; 0 is unknown.
  int32 at = 10;
  string final = 11;
  repeated string pipeline = 12;
  // labels is each pipeline entry's display name by index, empty for none.
  repeated string labels = 13;
  // note is why the run stopped, next what unblocks it.
  string note = 14;
  string next = 15;
  // ask is the question a driven run stopped on, options included.
  string ask = 16;
  // wait is the base task a driven ship stopped for.
  string wait = 17;
  string stop = 18;
  string done = 19;
  google.protobuf.Timestamp done_at = 20;
  google.protobuf.Timestamp updated = 21;
}

// A JudgeOutcome is what a judge decided and what the run did with it.
message JudgeOutcome {
  string verdict = 1;
  string reason = 2;
  string decision = 3;
  int32 changes = 4;
}

// A ReviewRound is one review round's findings and how they were settled.
message ReviewRound {
  string round = 1;
  int32 found = 2;
  int32 fixed = 3;
  int32 skipped = 4;
  int32 ask = 5;
}

// A ReviewHalf is the local or the remote review of a review gate.
message ReviewHalf {
  string state = 1;
  string via = 2;
  string action = 3;
  string detail = 4;
  repeated ReviewRound rounds = 5;
}

// A Gate is one entry of the task's flow and where it stands.
message Gate {
  string step = 1;
  string label = 2;
  string state = 3;
  string via = 4;
  string action = 5;
  // judged is a judge's subject: task, plan or change.
  string judged = 6;
  JudgeOutcome outcome = 7;
  ReviewHalf local = 8;
  ReviewHalf remote = 9;
}

// A Check is one CI check run, status or pipeline job.
message Check {
  string name = 1;
  string url = 2;
  string run = 3;
  bool cancelled = 4;
}

// HeadChecks is the CI state of a PR's head commit.
message HeadChecks {
  // state is green, red, pending, or empty with no checks.
  string state = 1;
  string sha = 2;
  bool required = 3;
  repeated Check failed = 4;
  repeated Check running = 5;
}

// A FileRef is one of the task's local files, such as a verdict or a findings
// file, by what it covers.
message FileRef {
  // name is a verdict's subject or a findings file's round.
  string name = 1;
  string path = 2;
}

// A Shipment is what a task's run left: its branch, PR, commit and files.
message Shipment {
  string task = 1;
  string title = 2;
  string url = 3;
  string branch = 4;
  string pr = 5;
  string pr_state = 6;
  HeadChecks checks = 7;
  string commit = 8;
  string plan = 9;
  string handoff = 10;
  string demo = 11;
  repeated FileRef verdicts = 12;
  repeated FileRef reviews = 13;
}

// A RunStatus is a run with its task's gates and shipment.
message RunStatus {
  Run run = 1;
  // agent is the profile the task's branch records, empty for the default.
  string agent = 2;
  repeated Gate gates = 3;
  Shipment shipment = 4;
}

message GetRunStatusRequest {
  // project is a project id or the path of its main checkout.
  string project = 1;
  // task narrows the reply to one task's run; empty lists every live run in
  // the project.
  string task = 2;
  // all lists every live run on the machine, whatever the project.
  bool all = 3;
  // caller is where a local f10 status runs; with it, an empty project
  // reads the caller's checkout, and an empty task its session's run.
  CallerContext caller = 4;
}

message GetRunStatusResponse {
  repeated RunStatus runs = 1;
  // view is the status as f10 status renders it: its --json shapes, as
  // JSON, for a client of the same release. Other clients read runs.
  bytes view = 2;
  // printed carries the warnings the read wrote to stderr.
  Printed printed = 3;
}

// StartMode is what the started agent is prompted to do.
enum StartMode {
  START_MODE_UNSPECIFIED = 0;
  // ship the task through its flow
  START_MODE_SHIP = 1;
  // plan the task and stop
  START_MODE_PLAN = 2;
  // read the task and wait to discuss it
  START_MODE_DISCUSS = 3;
}

message StartRequest {
  string project = 1;
  // task is the task id; pr picks up an existing PR instead, by url or number.
  string task = 2;
  string pr = 3;
  StartMode mode = 4;
  // flow names a declared flow; empty lets the project's rules pick it.
  string flow = 5;
  string pace = 6;
  // after is the task this one builds on; base is a branch to start from.
  string after = 7;
  string base = 8;
  // agent is a profile name; model overrides only the model.
  string agent = 9;
  string model = 10;
  // note is extra text a discussion's or a pickup's prompt carries. A flow
  // start refuses one, because a driven run takes its instructions from the
  // task.
  string note = 11;
  CallerContext caller = 12;
  // token is the argument as f10 start takes it: a task id with its
  // -suffix, a PR url or #n. When set it wins over task and pr, and task
  // names the task a picked-up PR belongs to.
  string token = 13;
  // tasks are the other ids, after token. A discussion opens token's
  // worktree and reads them all, and a flow start runs them in one batch.
  repeated string tasks = 14;
  // chain makes a flow start a range: token, then the one id in tasks, and
  // every id between, as `f10 start A -- B` runs them.
  bool chain = 15;
  // parallel caps a flow start's tasks running a skill at once; 0 keeps the
  // record's or the default.
  int32 parallel = 16;
}

message StartResponse {
  // task, branch, worktree, workspace_id and agent are a discussion's or a
  // pickup's; a batch opens its task after the call returns.
  string task = 1;
  string branch = 2;
  string worktree = 3;
  string workspace_id = 4;
  string agent = 5;
  // printed is the report f10 start prints, and the waits it reported.
  Printed printed = 6;
  // drive is the old name of batch, still filled for clients built
  // against it.
  int32 drive = 7 [deprecated = true];
  // log is the batch's log file, which grows until the batch exits.
  string log = 8;
  // attached is true when the daemon already ran that batch and the call
  // followed it instead of starting another.
  bool attached = 9;
  // batch is the number of the batch a flow start runs in, 0 for a
  // discussion or a pickup.
  int32 batch = 10;
}

// A DriveTask is one task of DriveRequest's field form, with its own agent
// profile.
message DriveTask {
  string id = 1;
  string agent = 2;
}

// DriveRequest is the old form of StartBatchRequest. Its field form (args
// unset) is kept for older clients only: a new client calls Start, which
// runs the same flow start with its closed-task check and plan-only mode.
// The field form refuses a start of closed tasks.
message DriveRequest {
  string project = 1;
  repeated DriveTask tasks = 2;
  // chain runs the tasks one after another, each based on the one before.
  bool chain = 3;
  string flow = 4;
  string pace = 5;
  string agent = 6;
  string model = 7;
  int32 parallel = 8;
  // plan_first is refused: a plan-only start is StartRequest with mode
  // START_MODE_PLAN.
  bool plan_first = 9 [deprecated = true];
  // args are the arguments as `f10 start` takes them. When set they win
  // over the fields above, so a rerun of a typed command line keys to the
  // record it opened.
  repeated string args = 10;
  // dir is the checkout the batch runs from.
  string dir = 11;
  // env is the allowlisted environment the batch runs with. Honored only on
  // the unix socket, because a remote client has no local session to pass.
  repeated string env = 12;
  // resume picks up the record with this number.
  int32 resume = 13;
  // answers are the answers to the batch's open asks, `ID=text` for one
  // task or bare text.
  repeated string answers = 14;
  // every is how often the tasks are polled; unset keeps the default.
  google.protobuf.Duration every = 15;
}

// DriveResponse is the old form of StartBatchResponse.
message DriveResponse {
  // drive is the batch's number in the project, 0 until its record opened.
  int32 drive = 1;
  // log is the batch's log file, which grows until the batch exits.
  string log = 2;
  // attached is true when the daemon already ran this batch and the call
  // joined it instead of starting another.
  bool attached = 3;
}

// StartBatchRequest starts a batch from a command line, or picks up the
// batch that command line already started.
message StartBatchRequest {
  string project = 1;
  // args are the arguments as `f10 start` takes them, so a rerun of a typed
  // command line keys to the record it opened.
  repeated string args = 2;
  // dir is the checkout the batch runs from; empty takes the project's.
  string dir = 3;
  // env is the allowlisted environment the batch runs with. Honored only on
  // the unix socket, because a remote client has no local session to pass.
  repeated string env = 4;
  // resume picks up the batch record with this number, for a client that
  // already resolved it; Resume takes a task id instead.
  int32 resume = 5;
}

message StartBatchResponse {
  // batch is the batch's number in the project, 0 until its record opened.
  int32 batch = 1;
  // log is the batch's log file, which grows until the batch exits.
  string log = 2;
  // attached is true when the daemon already ran this batch and the call
  // joined it instead of starting another.
  bool attached = 3;
}

// ResumeRequest names a stopped batch by one of its tasks. With no task, the
// project's one stopped batch resumes, and several are refused by name.
message ResumeRequest {
  string project = 1;
  // task is any task id of the batch, a bundle's rider included.
  string task = 2;
  // answers are the answers to the batch's open asks, `ID=text` for one
  // task or bare text.
  repeated string answers = 3;
  // every is how often the tasks are polled; unset keeps the record's.
  google.protobuf.Duration every = 4;
  // parallel caps the tasks running a skill at once; 0 keeps the record's.
  int32 parallel = 5;
  CallerContext caller = 6;
}

message ResumeResponse {
  // batch is the number of the batch resumed.
  int32 batch = 1;
  // log is the batch's log file, which grows until the batch exits.
  string log = 2;
  // attached is true when the batch was still running and the call joined
  // it.
  bool attached = 3;
  // printed is what f10 resume prints for the call.
  Printed printed = 4;
}

// MergeMode is how Finish lands a task.
enum MergeMode {
  MERGE_MODE_UNSPECIFIED = 0;
  // merge the task's own PR
  MERGE_MODE_PR = 1;
  // merge the PR even when someone else opened it
  MERGE_MODE_FORCE = 2;
  // merge a branch never pushed into the local default branch
  MERGE_MODE_LOCAL = 3;
  // close without merging
  MERGE_MODE_CLOSE = 4;
}

message FinishRequest {
  string project = 1;
  string task = 2;
  MergeMode merge = 3;
  bool ignore_checks = 4;
  // keep keeps a spike's experiment, committed on a branch.
  bool keep = 5;
  CallerContext caller = 6;
  // yes closes the caller's own workspace after the report, when the
  // caller runs inside the task's workspace, instead of refusing.
  bool yes = 7;
  // empty finishes a branch never pushed that adds nothing.
  bool empty = 8;
  // close names the bundle riders the PR delivers: ids, all or none.
  string close = 9;
}

message FinishResponse {
  string task = 1;
  string pr = 2;
  // commit is the merge commit, empty when nothing merged.
  string commit = 3;
  bool removed_worktree = 4;
  bool removed_branch = 5;
  bool closed_workspace = 6;
  // printed is the report and handoff f10 finish prints.
  Printed printed = 7;
  // close_workspace_id is the caller's own workspace, which the caller
  // closes once it printed the report, after focusing focus_workspace_id.
  // The daemon leaves both, because closing the caller's pane mid-call
  // would end the caller before it printed anything.
  string close_workspace_id = 8;
  string focus_workspace_id = 9;
}

message ForwardRequest {
  string project = 1;
  // task is the task id, with a -suffix for one of its parallel worktrees.
  string task = 2;
  // text is what the agent is told, such as a command or a note.
  string text = 3;
  CallerContext caller = 4;
}

message ForwardResponse {
  // workspace is the workspace the text went to.
  string workspace = 1;
  // sent is the text as typed into the agent's pane.
  string sent = 2;
  // note says what the delivery check saw, empty when all went well.
  string note = 3;
  // printed is the report f10 forward prints.
  Printed printed = 4;
}

// ListDrivesRequest is the old form of ListBatchesRequest.
message ListDrivesRequest {
  string project = 1;
  // all lists every record, not only the newest.
  bool all = 2;
  CallerContext caller = 3;
}

// A DriveRecord is the old form of Batch.
message DriveRecord {
  int32 number = 1;
  // args are the arguments as f10 start took them.
  repeated string args = 2;
  // state is running, stopped, done or cancelled.
  string state = 3;
  google.protobuf.Timestamp started = 4;
}

// ListDrivesResponse is the old form of ListBatchesResponse.
message ListDrivesResponse {
  repeated DriveRecord drives = 1;
  // printed is the table f10 status --batches prints.
  Printed printed = 2;
}

// CancelDriveRequest is the old form of StopBatchRequest.
message CancelDriveRequest {
  string project = 1;
  // drive is the batch's number; task, when set instead, is a task id whose
  // batch is stopped.
  int32 drive = 2;
  CallerContext caller = 3;
  string task = 4;
}

// CancelDriveResponse is the old form of StopBatchResponse.
message CancelDriveResponse {
  // printed is what f10 stop prints.
  Printed printed = 1;
}

message ListBatchesRequest {
  string project = 1;
  // all lists every batch, not only the newest 20.
  bool all = 2;
  CallerContext caller = 3;
}

// A Batch is the tasks one f10 start started, kept as a record so it can be
// stopped and resumed.
message Batch {
  int32 number = 1;
  // args are the arguments as f10 start took them.
  repeated string args = 2;
  // state is running, stopped, done or cancelled.
  string state = 3;
  google.protobuf.Timestamp started = 4;
  // tasks are the batch's tasks as typed, a bundle joined by +. Any of
  // them names the batch to Resume and StopBatch.
  repeated string tasks = 5;
}

message ListBatchesResponse {
  repeated Batch batches = 1;
  // printed is the table f10 status --batches prints.
  Printed printed = 2;
}

message StopBatchRequest {
  string project = 1;
  // task is any task id of the batch to stop, a bundle's rider included.
  string task = 2;
  CallerContext caller = 3;
}

message StopBatchResponse {
  // printed is what f10 stop prints.
  Printed printed = 1;
}
