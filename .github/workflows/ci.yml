name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # buf breaking compares proto/ against the default branch, which a PR
      # checkout does not hold as a ref.
      - name: Fetch the default branch
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # shellcheck ships preinstalled on the ubuntu-latest runner image. shfmt
      # does not, and is pinned: an unpinned formatter can change what counts as
      # correctly formatted and turn a green branch red without a commit.
      # go.mod lives in cli/, the Go half of the repo, and proto/tools pins buf;
      # the cache key must follow both.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            cli/go.sum
            proto/tools/go.sum
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1

      - uses: extractions/setup-just@v3

      # protoc-gen-es, the TypeScript generator, is an npm package pinned in
      # proto/package-lock.json; proto::lint regenerates to catch stale code.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: proto/package-lock.json

      # The same recipe developers run locally, so `just ci` and CI cannot
      # drift apart. ci is lint + test + test-race + the proto breaking checks -
      # it verifies, never rewrites.
      # cgo off, as the release builds: proves no dependency needs a C toolchain.
      # test-race turns cgo on for its own command, since -race needs it on linux.
      - name: Lint and test
        run: just ci
        env:
          CGO_ENABLED: '0'
