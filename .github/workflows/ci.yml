name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships preinstalled on the ubuntu-latest runner image. shfmt
      # does not, and is pinned: an unpinned formatter can change what counts as
      # correctly formatted and turn a green branch red without a commit.
      # go.mod lives in cli/, the Go half of the repo; the cache key must follow it.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: cli/go.sum
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1

      - uses: extractions/setup-just@v3

      # The same recipe developers run locally, so `just ci` and CI cannot
      # drift apart. ci is lint + test - it verifies, never rewrites.
      - name: Lint and test
        run: just ci
